name: Release (production database migrations)

# Manual only. Applies pending supabase/migrations to production with
# `supabase db push`. Runs as a dry run (plan only) unless `dry_run` is unticked.
# The `production` environment should require a reviewer, so every run waits
# for an explicit approval before it can read the production secrets.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list the migrations that would be applied (no changes)'
        type: boolean
        default: true

permissions:
  contents: read

# Never run two migration pushes at once.
concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate production database
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # Optional. The CLI reads it from the environment; it is never passed on the command line.
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      - name: Check production configuration
        # Fail loudly: a run that silently did nothing would look like success
        # (AGENTS.md: checks must fail on bad state).
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error title=Supabase production not configured::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF must be set on the production environment."
            exit 1
          fi
          echo "Ref: ${GITHUB_REF_NAME} @ ${GITHUB_SHA}  dry_run=${{ inputs.dry_run }}"

      - name: Plan (dry run) — migrations that would be applied
        run: supabase db push --project-ref "$SUPABASE_PROJECT_REF" --dry-run

      - name: Apply migrations to production
        if: inputs.dry_run == false
        run: supabase db push --project-ref "$SUPABASE_PROJECT_REF"
