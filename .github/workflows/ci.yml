name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Version consistency check
        run: npm run version:check
      - name: Lint
        run: npm run lint

  typecheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: TypeScript type check
        run: npm run typecheck

  unit-tests:
    needs: typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Bootstrap PostgreSQL auth environment & roles
        run: |
          psql "$DATABASE_URL" -f scripts/ci-bootstrap-db.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          PGPASSWORD: postgres
      - name: Apply schema migrations
        run: |
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration..."
            psql "$DATABASE_URL" -f "$migration"
          done
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          PGPASSWORD: postgres
      - name: Seed test database
        run: |
          psql "$DATABASE_URL" -f supabase/seed.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          PGPASSWORD: postgres
      - name: Verify PostgreSQL Row Level Security (RLS)
        run: npm run audit:rls
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          PGPASSWORD: postgres
      - name: Run unit & integration test suites
        run: npm run test:ci
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          PGPASSWORD: postgres

  build:
    needs: unit-tests
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://127.0.0.1:49321' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Next.js production build
        run: npm run build
