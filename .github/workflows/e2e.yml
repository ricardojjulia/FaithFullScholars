name: E2E Tests

# Browser E2E against a production build and a disposable local Supabase stack,
# with personas signed in through the real /login flow. Adopted from
# ChurchCore-LMS (.github/workflows/e2e.yml) and adapted to this repo.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_URL: http://127.0.0.1:3845

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Export local test environment
        shell: bash
        run: |
          eval "$(supabase status --output env)"
          TEST_USER_PASSWORD="$(openssl rand -base64 32)"

          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "::add-mask::$TEST_USER_PASSWORD"

          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "DATABASE_URL=$DB_URL"
            echo "TEST_USER_PASSWORD=$TEST_USER_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Wait for Supabase Auth
        run: |
          for attempt in {1..120}; do
            if curl --fail --silent --output /dev/null "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/health"; then
              exit 0
            fi
            sleep 1
          done
          supabase status
          exit 1

      - name: Seed pilot reference cohort
        # Distinguished-fellow tiers, postings and Common App applications that
        # the dossier and applicant-matrix specs exercise.
        run: npm run seed:pilot

      - name: Create E2E personas
        run: node scripts/ci-setup-test-users.mjs

      - name: Build the app (production build)
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
