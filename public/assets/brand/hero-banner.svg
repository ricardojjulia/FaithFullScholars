<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">FaithFull Scholars</title>
  <desc id="desc">A trusted professional network connecting theological scholars with seminaries, colleges, and ministry programs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1437"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="20" fill="url(#glow)"/>

  <!-- Network of scholars and institutions -->
  <g stroke="#a5b4fc" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <path d="M880 110 L990 170 L1110 120 M990 170 L960 280 L1090 300 L1110 120 M960 280 L860 250 L880 110 M1090 300 L1180 230 L1110 120"/>
  </g>
  <g fill="#c7d2fe">
    <circle cx="880" cy="110" r="7"/>
    <circle cx="1110" cy="120" r="7"/>
    <circle cx="960" cy="280" r="7"/>
    <circle cx="860" cy="250" r="5"/>
    <circle cx="1090" cy="300" r="5"/>
    <circle cx="1180" cy="230" r="5"/>
  </g>

  <!-- Open book with a cross: Scripture and scholarship -->
  <g transform="translate(990 170)">
    <circle r="62" fill="#1e1b4b" stroke="url(#gold)" stroke-width="3"/>
    <path d="M-38 -14 Q-19 -24 0 -14 Q19 -24 38 -14 V26 Q19 16 0 26 Q-19 16 -38 26 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <path d="M0 -14 V26" stroke="#d97706" stroke-width="2"/>
    <path d="M0 -44 V-20 M-9 -36 H9" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Aptos Display','Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="80" y="150" fill="#fbbf24" font-size="18" font-weight="700" letter-spacing="4">THEOLOGICAL SCHOLAR NETWORK</text>
    <text x="78" y="225" fill="#ffffff" font-size="72" font-weight="800" letter-spacing="-1">FaithFull Scholars</text>
    <text x="80" y="272" fill="#c7d2fe" font-size="24" font-weight="500">Find, vet and engage qualified theological faculty,</text>
    <text x="80" y="306" fill="#c7d2fe" font-size="24" font-weight="500">with confessional fit and trust built in.</text>
  </g>
  <rect x="80" y="330" width="120" height="4" rx="2" fill="url(#gold)"/>
</svg>
